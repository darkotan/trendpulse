<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Serenity 投研 — 704只标的实时追踪 | TrendPulse</title>
  <meta name="description" content="Serenity 投研终端：每日热点标的、多空评级、深度分析、AI产业链追踪。优先级分数=提及频率×观点确定度×催化剂新鲜度×风险回报比。">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--black:#171717;--white:#fff;--gray-900:#171717;--gray-600:#4d4d4d;--gray-500:#666;--gray-400:#808080;--gray-100:#ebebeb;--gray-50:#fafafa;--blue:#0072f5;--blue-bg:#ebf5ff;--blue-text:#0068d6;--green:#059669;--red:#dc2626;--orange:#e67e00;--accent:#7c3aed;--shadow:0 0 0 1px rgba(0,0,0,.08),0 2px 2px rgba(0,0,0,.04),0 8px 8px -8px rgba(0,0,0,.04),0 0 0 1px #fafafa}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--white);color:var(--black);font-family:'Geist',system-ui,sans-serif;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;line-height:1.5}
    header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);box-shadow:0 0 0 1px rgba(0,0,0,.08);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between}
    .logo{font-size:15px;font-weight:600;letter-spacing:-0.32px;color:var(--black);text-decoration:none;display:flex;align-items:center;gap:8px}
    .logo-dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
    .header-actions a{font-size:13px;color:var(--gray-500);text-decoration:none}
    .header-actions a:hover{color:var(--black)}

    .container{max-width:860px;margin:0 auto;padding:40px 24px}
    .hero{margin-bottom:32px}
    .hero h1{font-size:32px;font-weight:600;letter-spacing:-1.28px;margin-bottom:6px;color:var(--black)}
    .hero .sub{font-size:15px;color:var(--gray-500)}

    .story-box{background:var(--gray-50);border:1px solid var(--gray-100);border-radius:12px;padding:18px 22px;margin-bottom:28px;font-size:14px;color:var(--gray-600);line-height:1.7;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
    .story-box span{display:inline-flex;align-items:center;gap:4px}
    .story-box .sep{color:var(--gray-100)}

    .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:28px}
    .stat-box{background:var(--white);box-shadow:var(--shadow);border-radius:10px;padding:14px 16px;text-align:center}
    .stat-box .label{font-size:10px;color:var(--gray-400);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
    .stat-box .val{font-size:22px;font-weight:600;font-family:'Geist Mono',monospace;letter-spacing:-0.44px}
    .stat-box .sub{font-size:11px;color:var(--gray-400);margin-top:2px}

    .section-title{font-size:13px;font-weight:600;color:var(--gray-400);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px}

    .picks-grid{display:flex;flex-direction:column;gap:16px;margin-bottom:36px}
    .pick{background:var(--white);box-shadow:var(--shadow);border-radius:14px;overflow:hidden;transition:box-shadow .2s}
    .pick:hover{box-shadow:0 0 0 1px rgba(0,0,0,.08),0 4px 8px rgba(0,0,0,.06),0 16px 16px -8px rgba(0,0,0,.06)}
    .pick-top{padding:20px 24px;display:flex;align-items:flex-start;gap:16px}
    .pick-rank{font-size:13px;font-weight:500;color:var(--gray-400);font-family:'Geist Mono',monospace;min-width:28px;padding-top:3px}
    .pick-main{flex:1;min-width:0}
    .pick-head{display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap}
    .pick-sym{font-size:18px;font-weight:600;letter-spacing:-0.36px;color:var(--black)}
    .pick-view{font-size:11px;font-weight:500;padding:2px 10px;border-radius:6px}
    .bull{color:var(--green);background:rgba(5,150,105,.08)}
    .bear{color:var(--red);background:rgba(220,38,38,.08)}
    .neutral-tag{color:var(--gray-500);background:var(--gray-50)}
    .pick-pri{font-size:12px;font-weight:500;font-family:'Geist Mono',monospace;color:var(--accent);cursor:help}
    .pick-cat{font-size:12px;color:var(--gray-400);margin-top:2px}
    .pick-body{padding:0 24px 20px;display:flex;flex-direction:column;gap:8px}
    .blk{padding:14px 16px;border-radius:8px;font-size:14px;line-height:1.75}
    .blk .blk-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;display:block;margin-bottom:6px}
    .blk-co{background:var(--blue-bg);color:var(--gray-900)}.blk-co .blk-label{color:var(--blue-text)}
    .blk-th{background:rgba(5,150,105,.04);color:var(--gray-900)}.blk-th .blk-label{color:var(--green)}
    .blk-ri{background:rgba(245,158,11,.04);color:var(--gray-900)}.blk-ri .blk-label{color:var(--orange)}

    .legend{font-size:11px;color:var(--gray-400);margin-top:8px;padding:8px 14px;background:var(--gray-50);border-radius:8px;display:flex;flex-wrap:wrap;gap:12px}
    .legend span{display:inline-flex;align-items:center;gap:4px}

    footer{text-align:center;padding:40px 24px;border-top:1px solid var(--gray-100);margin-top:40px;font-size:12px;color:var(--gray-400)}
    footer a{color:var(--gray-500)}

    @media(max-width:600px){
      .pick-top{flex-direction:column;gap:8px}
      .stats-row{grid-template-columns:repeat(2,1fr)}
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="logo"><span class="logo-dot"></span>Serenity 投研追踪</a>
    <div class="header-actions">
      <a href="/dashboard">数据面板</a>
    </div>
  </header>

  <div class="container" id="app">
    <div class="hero">
      <h1>Serenity 投研实时追踪</h1>
      <p class="sub" id="heroSub">加载中...</p>
      <div class="legend">
        <span>📊 <strong>优先级分数</strong> = 提及频率 × 观点确定度 × 催化剂新鲜度 × 风险回报比</span>
        <span>· 分数越高 = 越需要立刻关注</span>
        <span>· 400+ = 最高优先级</span>
      </div>
    </div>

    <div class="story-box" id="storyBox"></div>
    <div class="stats-row" id="statsRow"></div>

    <div class="section-title">🔥 热点标的</div>
    <div class="picks-grid" id="picksGrid">加载中...</div>
  </div>

  <footer>
    <p>数据来源: analysissite.vercel.app · Serenity 投研终端 · <a href="/dashboard">TrendPulse</a></p>
  </footer>

  <script>
    const $=s=>document.getElementById(s);const esc=s=>s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):'';

    async function load(){
      try{
        const[sr,data]=await Promise.all([fetch('/api/serenity').then(r=>r.json()),fetch('/api/all').then(r=>r.json())]);
        const picks=sr.hot_picks||[],btc=(data.crypto||[]).find(c=>c.symbol==='BTC'),spy=(data.stocks||[]).find(s=>s.symbol==='SPY'),vix=(data.vix||{}),fg=(data.fear_greed||{});

        $('heroSub').textContent=`追踪 ${sr.total_stocks||704} 只标的 · ${sr.bullish_count||0} 看多 · ${sr.bearish_count||0} 看空 · 更新于 ${new Date(sr.updated_at*1000).toLocaleString()}`;

        $('storyBox').innerHTML=`
          <span>₿ <strong>BTC</strong> $${btc?btc.price?.toLocaleString():'--'} <span style="color:${btc&&btc.change_pct>=0?'var(--green)':'var(--red)'};font-weight:500">${btc?(btc.change_pct>=0?'+':'')+btc.change_pct+'%':'--'}</span></span>
          <span class="sep">|</span>
          <span>📈 <strong>S&P 500</strong> $${spy?spy.price:'--'} <span style="color:${spy&&spy.change_pct>=0?'var(--green)':'var(--red)'};font-weight:500">${spy?(spy.change_pct>=0?'+':'')+spy.change_pct+'%':'--'}</span></span>
          <span class="sep">|</span>
          <span>📊 <strong>VIX</strong> ${vix.price||'--'}</span>
          <span class="sep">|</span>
          <span>😱 <strong>恐慌贪婪</strong> ${fg.score||'--'} (${fg.sentiment||'--'})</span>`;

        $('statsRow').innerHTML=`
          <div class="stat-box"><div class="label">追踪标的</div><div class="val" style="color:var(--accent)">${sr.total_stocks||704}</div><div class="sub">全覆盖</div></div>
          <div class="stat-box"><div class="label">🟢 看多</div><div class="val" style="color:var(--green)">${sr.bullish_count||0}</div><div class="sub">${picks.filter(p=>p.view.includes('看多')).length} 在热点</div></div>
          <div class="stat-box"><div class="label">🔴 看空</div><div class="val" style="color:var(--red)">${sr.bearish_count||0}</div><div class="sub">谨慎对待</div></div>
          <div class="stat-box"><div class="label">最高优先级</div><div class="val">${picks[0]?picks[0].symbol:'--'}</div><div class="sub">${picks[0]?picks[0].priority:'--'} 分</div></div>`;

        $('picksGrid').innerHTML=picks.map(p=>{
          const isBull=p.view.includes('看多'),isBear=p.view.includes('看空');
          return`<div class="pick">
            <div class="pick-top">
              <div class="pick-rank">#${p.rank}</div>
              <div class="pick-main">
                <div class="pick-head">
                  <span class="pick-sym">${esc(p.symbol)}</span>
                  <span class="pick-view ${isBull?'bull':isBear?'bear':'neutral-tag'}">${esc(p.view)}</span>
                  <span class="pick-pri" title="优先级 = 提及频率 × 确定度 × 新鲜度 × 风险回报比">⚡ ${p.priority}</span>
                </div>
                <div class="pick-cat">${esc(p.change||'')} · 24h 提及 ${p.mentions_24h||0} 次 · 7d 提及 ${p.mentions_7d||0} 次</div>
              </div>
            </div>
            <div class="pick-body">
              <div class="blk blk-co"><span class="blk-label">🏢 公司介绍</span>${esc(p.company||'暂无')}</div>
              <div class="blk blk-th"><span class="blk-label">📈 ${isBull?'为什么看好':'为什么看空'}</span>${esc(p.thesis||'暂无')}</div>
              <div class="blk blk-ri"><span class="blk-label">⚠️ 风险提示</span>${esc(p.risk||'暂无')}</div>
            </div>
          </div>`;
        }).join('');

      }catch(e){$('picksGrid').innerHTML='<div style="color:var(--gray-400);padding:40px;text-align:center">加载失败，刷新试试</div>';}
    }
    load();setInterval(load,120000);
  </script>
</body>
</html>
