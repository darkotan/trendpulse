<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Blog | TrendPulse</title>
  <meta name="description" content="TrendPulse blog — market insights, trading strategies, and financial analysis.">
  <meta property="og:title" content="Blog | TrendPulse">
  <meta property="og:description" content="TrendPulse blog — market insights, trading strategies, and financial analysis.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/og-image.png">
  <link rel="canonical" href="https://trendscan.org/blog">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--black:#171717;--white:#fff;--gray-600:#4d4d4d;--gray-500:#666;--gray-400:#808080;--gray-100:#ebebeb;--gray-50:#fafafa;--blue:#0072f5;--accent:#7c3aed}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{overflow-x:hidden;max-width:100vw}
    body{background:var(--white);color:var(--black);font-family:'Geist',system-ui,sans-serif;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;line-height:1.5}
    .container{max-width:760px;margin:0 auto;padding:40px 24px}
    h1{font-size:28px;font-weight:600;letter-spacing:-1.12px;margin-bottom:32px}
    .article-card{display:block;padding:20px 0;border-bottom:1px solid var(--gray-100);text-decoration:none;color:inherit;transition:background .15s}
    .article-card:hover h2{color:var(--blue)}
    .article-card h2{font-size:20px;font-weight:600;letter-spacing:-0.4px;margin-bottom:4px;transition:color .15s}
    .article-card .date{font-size:12px;color:var(--gray-400);margin-bottom:6px;font-family:'Geist Mono',monospace}
    .article-card .desc{font-size:14px;color:var(--gray-600);line-height:1.6}
    .empty{padding:80px 0;text-align:center;color:var(--gray-400);font-size:14px}
    footer{text-align:center;padding:36px 20px;border-top:1px solid var(--gray-100);margin-top:36px;font-size:12px;color:var(--gray-400)}
    footer a{color:var(--gray-500);text-decoration:none}
    footer a:hover{color:var(--black)}
    @media(max-width:480px){
      .container{padding:24px 16px}
      h1{font-size:22px}
      .article-card h2{font-size:17px}
    }
  </style>
</head>
<body>
{% include '_header.html' %}
<div class="container">
<h1>Blog</h1>
{% for a in articles %}
<a class="article-card" href="/blog/{{ a.slug }}">
  <div class="date">{{ a.date }}</div>
  <h2>{{ a.title }}</h2>
  <p class="desc">{{ a.description }}</p>
</a>
{% else %}
<div class="empty">No articles yet. Check back soon.</div>
{% endfor %}
</div>
<footer><p><a href="/">TrendPulse</a></p></footer>
</body>
</html>
