<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Blog | TrendPulse</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{--black:#171717;--white:#fff;--gray-500:#666;--gray-400:#808080;--gray-100:#ebebeb;--blue:#0072f5}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100vw}body{background:var(--white);color:var(--black);font-family:'Geist',system-ui,sans-serif;font-feature-settings:'liga'}
header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.95);box-shadow:0 0 0 1px rgba(0,0,0,.08);padding:0 24px;height:56px;display:flex;align-items:center}
header a{font-size:15px;font-weight:600;color:var(--black);text-decoration:none}
.container{max-width:760px;margin:0 auto;padding:40px 24px}
h1{font-size:28px;font-weight:600;letter-spacing:-1.12px;margin-bottom:32px}
.article{display:block;padding:20px 0;border-bottom:1px solid var(--gray-100);text-decoration:none;color:inherit}
.article:hover h2{color:var(--blue)}
.article h2{font-size:20px;font-weight:600;letter-spacing:-0.4px;margin-bottom:6px;transition:color .15s}
.article p{font-size:14px;color:var(--gray-500);line-height:1.6}
.article .date{font-size:12px;color:var(--gray-400);margin-bottom:8px}
footer{text-align:center;padding:40px 24px;font-size:12px;color:var(--gray-400)}
footer a{color:var(--gray-500)}
</style></head><body>
<header>
<a href="/" style="font-size:15px;font-weight:600;color:var(--black);text-decoration:none">Serenity 投研追踪</a>
<div style="display:flex;gap:16px">
  <a href="/blog" style="font-size:13px;color:var(--gray-500);text-decoration:none">博客</a>
  <a href="/performance" style="font-size:13px;color:var(--gray-500);text-decoration:none">📊 战绩</a>
  <a href="/dashboard" style="font-size:13px;color:var(--gray-500);text-decoration:none">面板</a>
</div>
</header>
<div class="container">
<h1>Blog</h1>
{% for a in articles %}
<a class="article" href="/blog/{{ a.slug }}">
  <div class="date">{{ a.date }}</div>
  <h2>{{ a.title }}</h2>
  <p>{{ a.description }}</p>
</a>
{% endfor %}
</div>
<footer><p><a href="/">TrendPulse</a></p></footer>
</body></html>
