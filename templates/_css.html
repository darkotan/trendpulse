<!-- TrendPulse Global CSS — OptionsData unified design system -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg-primary: #ffffff; --bg-secondary: #f8fafc;
    --bg-card: #ffffff; --bg-card-hover: #f8fafc;
    --accent: #7c3aed; --accent-dim: #6d28d9; --accent-glow: rgba(124,58,237,0.15);
    --text: #171717; --text-primary: #171717; --text-secondary: #666666; --text-muted: #999999;
    --border: #e8e8ec; --border-accent: rgba(124,58,237,0.3);
    --red: #dc2626; --green: #0a9950; --yellow: #eab308; --blue: #3b82f6; --orange: #e67e00;
    --shadow: 0 0 0 1px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.06);
    --shadow-md: 0 0 0 1px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.08);
    --radius: 10px; --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --mono: 'SF Mono', 'Fira Code', monospace;
    --purple: #8b5cf6; --purple-bg: rgba(139,92,246,.1);
    --shadow-card: var(--shadow); --shadow-card-hover: var(--shadow-md);
    --radius-lg: 16px; --radius-xl: 20px;
    --green-bg: rgba(5,150,105,.08);
    --card: var(--bg-card); --card-hover: var(--bg-secondary);
    --border-light: var(--border);
    --muted: var(--text-muted);
    --bull: var(--green); --bear: var(--red);
    --green-dim: rgba(5,150,105,.08);
    --blue-dim: rgba(0,114,245,.08);
    --red-dim: rgba(220,38,38,.08);
    --yellow-dim: rgba(230,126,0,.08);
    --yellow: var(--orange);
    /* Backward-compatible aliases */
    --gray-50: #f8fafc; --gray-100: #e8e8ec; --gray-200: #e8e8ec;
    --gray-400: #999999; --gray-500: #666666; --gray-600: #666666; --gray-900: #171717;
    --black: #171717; --white: #ffffff;
    --blue-bg: rgba(124,58,237,0.04); --blue-text: #7c3aed;
    --card-shadow: 0 0 0 1px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-primary: #0f0f0f; --bg-secondary: #1a1a1a;
      --bg-card: #1a1a1a; --bg-card-hover: #242424;
      --text: #e5e5e5; --text-primary: #e5e5e5; --text-secondary: #a3a3a3; --text-muted: #737373;
      --border: #2a2a2a; --border-accent: rgba(139,92,246,0.4);
      --gray-50: #1a1a1a; --gray-100: #2a2a2a; --gray-200: #2a2a2a;
      --gray-400: #737373; --gray-500: #a3a3a3; --gray-600: #a3a3a3; --gray-900: #e5e5e5;
      --black: #e5e5e5; --white: #1a1a1a;
      --blue-bg: rgba(139,92,246,0.1); --blue-text: #a78bfa;
      --shadow: 0 0 0 1px rgba(255,255,255,.06), 0 1px 3px rgba(0,0,0,.3);
      --shadow-md: 0 0 0 1px rgba(255,255,255,.06), 0 4px 12px rgba(0,0,0,.4);
      --shadow-card: var(--shadow); --shadow-card-hover: var(--shadow-md);
      --green-bg: rgba(5,150,105,.12);
      --card: var(--bg-card); --card-hover: var(--bg-secondary);
      --border-light: var(--border);
      --muted: var(--text-muted);
      --bull: var(--green); --bear: var(--red);
      --green-dim: rgba(5,150,105,.12);
      --blue-dim: rgba(0,114,245,.12);
      --red-dim: rgba(220,38,38,.12);
      --yellow-dim: rgba(230,126,0,.12);
    }
  }
  body { background: var(--bg-primary); color: var(--text-primary); font-family: var(--font); line-height: 1.6; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); text-decoration: none; transition: color 0.2s; }
  a:hover { color: var(--accent-dim); }

  /* ── Header — 1:1 OptionsData .sub-* ── */
  .sub-header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid #e8e8ec;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .sub-logo{font-size:16px;font-weight:700;letter-spacing:-0.4px;color:#171717;text-decoration:none;display:flex;align-items:center;gap:8px;flex-shrink:0}
  .sub-logo-dot{width:8px;height:8px;border-radius:50%;background:#7c3aed}
  .sub-nav{display:flex;align-items:center;gap:2px}
  .sub-nav a{font-size:13px;font-weight:500;color:#666;text-decoration:none;padding:7px 14px;border-radius:8px;transition:all .15s;white-space:nowrap}
  .sub-nav a:hover{color:#171717;background:#f5f5f5}
  .sub-nav a.active{color:#7c3aed;background:rgba(124,58,237,.08);font-weight:600}
  .sub-nav-sep{width:1px;height:18px;background:#e8e8ec;margin:0 4px}
  .sub-nav-ext{font-size:11px!important;color:#999!important;text-decoration:none;padding:3px 10px;border-radius:6px;transition:all .15s}
  .sub-nav-ext:hover{color:#666!important;background:#f5f5f5}
  .sub-nav-toggle{display:none;background:none;border:none;color:#171717;font-size:1.2rem;cursor:pointer;padding:8px}
  @media(max-width:768px){.sub-nav{display:none;flex-direction:column;position:absolute;top:56px;left:0;right:0;background:rgba(255,255,255,.98);backdrop-filter:blur(16px);border-bottom:1px solid #e8e8ec;padding:8px 16px;gap:4px;z-index:99}.sub-nav.open{display:flex}.sub-nav-sep{display:none}.sub-nav a,.sub-nav-ext{padding:10px 14px;width:100%}.sub-nav-toggle{display:block}}

  /* ── Container ── */
  .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }

  /* ── Cards ── */
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; transition: all 0.3s; }
  .card:hover { border-color: var(--border-accent); transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0,0,0,0.08); }

  /* ── Tables ── */
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th { background: var(--bg-secondary); padding: 12px 16px; text-align: left; font-weight: 600; color: var(--text-muted); text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.05em; white-space: nowrap; }
  td { padding: 10px 16px; border-top: 1px solid var(--border); font-family: var(--mono); font-size: 0.8rem; white-space: nowrap; }
  tr:hover td { background: rgba(124,58,237,0.03); }
  .green { color: var(--green); } .red { color: var(--red); }

  /* ── Stats ── */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; margin-bottom: 2rem; }
  .stat-card { text-align: center; padding: 1.5rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; }
  .stat-card .value { font-size: 2rem; font-weight: 800; color: var(--accent); }
  .stat-card .label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.25rem; }

  /* ── Buttons ── */
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; border-radius: 10px; font-weight: 600; font-size: 1rem; transition: all 0.2s; cursor: pointer; border: none; }
  .btn-primary { background: var(--accent); color: var(--bg-primary); }
  .btn-primary:hover { opacity: 0.9; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(124, 58, 237, 0.3); color: var(--bg-primary); }
  .btn-secondary { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--border-accent); transform: translateY(-2px); color: var(--text-primary); }

  /* ── Sections ── */
  .section { max-width: 1200px; margin: 0 auto; padding: 4rem 2rem; }
  .section-title { text-align: center; font-size: 2rem; font-weight: 700; margin-bottom: 3rem; }
  .section-title span { color: var(--accent); }

  /* ── Footer ── */
  footer { border-top: 1px solid var(--border); padding: 3rem 2rem; text-align: center; color: var(--text-muted); font-size: 0.85rem; }
  footer a { color: var(--text-secondary); }
  footer a:hover { color: var(--text-primary); }

  /* ── Responsive ── */
  @media(max-width:768px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } .section { padding: 2rem 1rem; } td, th { padding: 8px 10px; font-size: 0.7rem; } }
</style>
