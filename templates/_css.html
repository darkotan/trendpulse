<!-- TrendPulse Global CSS — included by ALL pages -->
<style>
  /* ── CSS Variables: System dark/light ── */
  :root {
    --bg: #ffffff;
    --bg-card: #fafafa;
    --bg-secondary: #f5f5f5;
    --text: #171717;
    --text-secondary: #666;
    --text-muted: #999;
    --border: #e5e5e5;
    --border-light: #f0f0f0;
    --accent: #7c3aed;
    --accent-dim: rgba(124,58,237,.06);
    --green: #059669;
    --green-bg: rgba(5,150,105,.08);
    --red: #dc2626;
    --red-bg: rgba(220,38,38,.06);
    --blue: #0072f5;
    --orange: #e67e00;
    --shadow: 0 0 0 1px rgba(0,0,0,.05), 0 1px 3px rgba(0,0,0,.06);
    --shadow-md: 0 0 0 1px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.08);
    --radius: 10px;
    --font: 'Geist', system-ui, -apple-system, sans-serif;
    --mono: 'Geist Mono', 'SF Mono', 'Menlo', monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0a;
      --bg-card: #141414;
      --bg-secondary: #1a1a1a;
      --text: #e5e5e5;
      --text-secondary: #a0a0a0;
      --text-muted: #666;
      --border: #262626;
      --border-light: #1f1f1f;
      --accent-dim: rgba(124,58,237,.12);
      --green-bg: rgba(5,150,105,.12);
      --red-bg: rgba(220,38,38,.1);
      --shadow: 0 0 0 1px rgba(255,255,255,.06), 0 1px 3px rgba(0,0,0,.3);
      --shadow-md: 0 0 0 1px rgba(255,255,255,.06), 0 4px 12px rgba(0,0,0,.4);
    }
  }

  /* ── Reset ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { overflow-x: clip; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-feature-settings: 'liga';
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ── Header ── */
  .site-header {
    position: sticky; top: 0; z-index: 100;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 0 24px; height: 52px;
    display: flex; align-items: center; justify-content: space-between;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    background: color-mix(in srgb, var(--bg) 85%, transparent);
  }
  .site-logo {
    font-size: 15px; font-weight: 600; letter-spacing: -0.32px;
    color: var(--text); text-decoration: none;
    display: flex; align-items: center; gap: 8px;
  }
  .site-logo:hover { text-decoration: none; }
  .site-logo-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .site-nav { display: flex; align-items: center; gap: 2px; }
  .site-nav a {
    font-size: 13px; color: var(--text-secondary); text-decoration: none;
    padding: 6px 12px; border-radius: 6px; transition: all .15s;
    white-space: nowrap;
  }
  .site-nav a:hover { color: var(--text); background: var(--bg-secondary); text-decoration: none; }
  .site-nav a.active { color: var(--accent); background: var(--accent-dim); font-weight: 500; }

  /* ── Container ── */
  .container { max-width: 960px; margin: 0 auto; padding: 32px 20px; }

  /* ── Cards ── */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    .site-header { padding: 0 16px; }
    .site-nav { gap: 0; }
    .site-nav a { font-size: 12px; padding: 6px 8px; }
    .container { padding: 20px 12px; }
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
