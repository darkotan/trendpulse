<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Serenity 战绩 — 历史准确率 & 收益 | TrendPulse</title>
<meta name="description" content="Serenity 历史战绩分析：看涨/看空准确率、校准曲线、提及后收益追踪。224只标的真实数据。">
<!-- fonts loaded via _css.html -->
<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100vw}
body { /* bg from _css.html */ }

.container{max-width:900px;margin:0 auto;padding:28px 16px}
h1{font-size:24px;font-weight:600;letter-spacing:-0.72px}
.sub{font-size:13px;color:var(--gray-500);margin-bottom:24px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:24px}
.card{box-shadow:0 0 0 1px rgba(0,0,0,.06);border-radius:10px;padding:16px}
.card .l{font-size:10px;color:var(--gray-400);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.card .v{font-size:24px;font-weight:700;font-family:'Geist Mono',monospace}
.card .s{font-size:10px;color:var(--gray-400);margin-top:2px}
.section-title{font-size:11px;font-weight:600;color:var(--gray-400);text-transform:uppercase;letter-spacing:1px;margin:24px 0 10px;padding-bottom:8px;border-bottom:1px solid var(--gray-100)}

/* Dividers */
.divider{border:none;border-top:1px solid var(--gray-100);margin:24px 0}

/* Loading & empty states */
.loading{text-align:center;padding:60px 20px;color:var(--gray-400);font-size:14px}
.loading .spinner{display:inline-block;width:24px;height:24px;border:2px solid var(--gray-100);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:32px 16px;color:var(--gray-400);font-size:13px;background:var(--gray-50);border-radius:8px}

/* Top 5 list */
.top-list{display:flex;flex-direction:column;gap:6px}
.top-item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--gray-50);border-radius:8px}
.top-rank{font-size:13px;font-weight:600;color:var(--gray-400);font-family:'Geist Mono',monospace;min-width:20px}
.top-sym{font-weight:600;font-size:14px;flex:1}
.top-chain{font-size:12px;color:var(--gray-500)}
.top-ret{font-weight:700;font-size:14px;font-family:'Geist Mono',monospace}

/* Heatmap cards */
.heat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.heat-card{box-shadow:0 0 0 1px rgba(0,0,0,.06);border-radius:10px;padding:14px 16px}
.heat-card .view-name{font-size:13px;font-weight:600;margin-bottom:8px;color:var(--gray-600)}
.heat-row{display:flex;gap:6px;flex-wrap:wrap}
.heat-badge{padding:4px 10px;border-radius:6px;font-size:11px;font-family:'Geist Mono',monospace;font-weight:500}
.hot{background:rgba(5,150,105,.1);color:var(--green)}
.warm{background:rgba(5,150,105,.05);color:#0a7a55}
.cool{background:#f5f5f5;color:var(--gray-500)}
.cold{background:rgba(220,38,38,.05);color:var(--red)}

/* Calibration list */
.cal-list{display:flex;flex-direction:column;gap:6px}
.cal-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--gray-50);border-radius:8px;font-size:13px}
.cal-group{font-weight:500;flex:1;min-width:0;font-size:12px}
.cal-n{font-size:11px;color:var(--gray-400);min-width:30px;font-family:'Geist Mono',monospace}
.cal-wr{font-weight:600;min-width:50px;text-align:right;font-family:'Geist Mono',monospace}
.cal-ex{font-weight:600;min-width:55px;text-align:right;font-family:'Geist Mono',monospace;font-size:12px}
.cal-bar{height:14px;border-radius:3px;min-width:4px}

/* Stock timeline */
.stock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.stock-card{box-shadow:0 0 0 1px rgba(0,0,0,.06);border-radius:10px;padding:14px 16px}
.stock-card .sym{font-size:15px;font-weight:700}
.stock-card .meta{font-size:11px;color:var(--gray-400);margin-top:4px}
.stock-card .perf{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.stock-card .perf span{padding:3px 8px;border-radius:4px;font-size:11px;font-family:'Geist Mono',monospace;font-weight:500}
.stock-card .since{font-size:18px;font-weight:700;margin-top:6px;font-family:'Geist Mono',monospace}

.tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:500}
.tag-bull{background:rgba(5,150,105,.08);color:var(--green)}
.tag-bear{background:rgba(220,38,38,.08);color:var(--red)}

footer{text-align:center;padding:36px 20px;border-top:2px solid var(--gray-100);margin-top:36px;font-size:11px;color:var(--gray-400)}

@media(max-width:480px){
.cards{grid-template-columns:repeat(2,1fr)}
.heat-grid{grid-template-columns:1fr}
.stock-grid{grid-template-columns:1fr}
.card .v{font-size:20px}
.container{padding:20px 12px}
h1{font-size:20px}
.top-item{padding:10px 12px;gap:8px}
.cal-item{padding:8px 10px;gap:6px}
.cal-group{font-size:11px}
}
</style>
</head>
<body>
{% include '_header.html' %}
<div class="container" id="app">
<div class="loading"><div class="spinner"></div><br>加载数据中...</div>
</div>
<footer><p>来源: analysissite.vercel.app · 胜率=跑赢SPY · 超额=扣除基准 · 过往不代表未来</p></footer>
<div style="text-align:center;padding:20px 16px">
<span style="font-size:10px;color:var(--gray-400);text-transform:uppercase;letter-spacing:1px">Sponsored</span>
<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px">
<a href="https://accounts.binance.com/en/register?ref=GRO_28502_3H9MX" target="_blank" rel="nofollow sponsored" style="display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:1px solid var(--gray-100);border-radius:8px;text-decoration:none;color:var(--black);font-size:13px;font-weight:500">🟡 Binance <span style="color:var(--blue);font-size:12px">10% off →</span></a>
<a href="https://www.okx.com/join/35101515" target="_blank" rel="nofollow sponsored" style="display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:1px solid var(--gray-100);border-radius:8px;text-decoration:none;color:var(--black);font-size:13px;font-weight:500">⚫ OKX <span style="color:var(--blue);font-size:12px">Sign up →</span></a>
</div>
</div>

<script>
fetch('/api/performance').then(r=>r.json()).then(d=>{
if(d.error){throw new Error(d.error);}
const h=d.heatmap||[],c=d.calibration||[],stocks=d.stocks_timeline||[],top=d.top_returns||[],s=d.summary||{},updated=d.updated||'';

function hcls(v){const n=parseFloat(v);return n>=55?'hot':n>=50?'warm':n>=40?'cool':'cold';}
function heatBadge(label,pct){return`<span class="heat-badge ${hcls(pct)}">${label}: ${pct||'N/A'}</span>`;}
function esc(str){return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function signClass(v){return String(v||'').startsWith('+')?'var(--green)':'var(--red)';}
function signBg(v){return String(v||'').startsWith('+')?'rgba(5,150,105,.06)':'rgba(220,38,38,.06)';}

let html=`<h1>📊 Serenity 历史战绩</h1>`;
html+=`<p class="sub">${s.total_stocks_tracked||224} 只标的 · ${s.positive_return||161} 正收益 · 跑赢 SPY 的比例${updated?' · 更新: '+esc(updated):''}</p>`;

// Summary cards
const total=s.total_stocks_tracked||224;
const pos=s.positive_return||161;
const neg=s.negative_return||63;
html+=`<div class="cards">
<div class="card"><div class="l">追踪标的</div><div class="v">${total}</div></div>
<div class="card"><div class="l">至今正收益</div><div class="v" style="color:var(--green)">${pos}</div><div class="s">${total?((pos/total)*100).toFixed(0):'0'}%</div></div>
<div class="card"><div class="l">至今负收益</div><div class="v" style="color:var(--red)">${neg}</div><div class="s">${total?((neg/total)*100).toFixed(0):'0'}%</div></div>
</div>`;

// Top returns
html+=`<hr class="divider"><div class="section-title">🏆 至今最高收益</div>`;
if(top.length){
html+=`<div class="top-list">`;
top.forEach((item,i)=>{
html+=`<div class="top-item">
<span class="top-rank">#${i+1}</span>
<span class="top-sym">${esc(item.symbol)}</span>
<span class="top-chain">${esc(item.chain)}</span>
<span class="top-ret" style="color:var(--green)">${esc(item.return)}</span>
</div>`;
});
html+=`</div>`;
} else {
html+=`<div class="empty-state">暂无最高收益数据</div>`;
}

// Heatmap
html+=`<hr class="divider"><div class="section-title">📈 观点 × 时间窗口胜率</div>`;
if(h.length){
html+=`<div class="heat-grid">`;
h.forEach(r=>{
const viewName=esc((r.view||'unknown').replace(/_/g,' '));
html+=`<div class="heat-card">
<div class="view-name">${viewName}</div>
<div class="heat-row">
${heatBadge('1D',r['1d'])}${heatBadge('5D',r['5d'])}${heatBadge('1W',r['1w'])}${heatBadge('1M',r['1m'])}${heatBadge('3M',r['3m'])}${heatBadge('6M',r['6m'])}
</div>
</div>`;
});
html+=`</div>`;
} else {
html+=`<div class="empty-state">暂无胜率数据</div>`;
}

// Calibration
html+=`<hr class="divider"><div class="section-title">🎯 校准曲线（1M 表现）</div>`;
if(c.length){
html+=`<div class="cal-list">`;
c.forEach(r=>{
const wr=parseFloat(r.win_rate)||0;
const wrColor=wr>=60?'var(--green)':wr>=50?'var(--orange)':'var(--red)';
const exColor=String(r.avg_excess||'').startsWith('+')?'var(--green)':'var(--red)';
html+=`<div class="cal-item">
<span class="cal-group">${esc(r.group)}</span>
<span class="cal-n">N=${r.n||0}</span>
<span class="cal-wr" style="color:${wrColor}">${esc(r.win_rate)}</span>
<span class="cal-ex" style="color:${exColor}">${esc(r.avg_excess)}</span>
<span class="cal-bar" style="width:${Math.max(4,wr*2)}px;background:${wrColor}"></span>
</div>`;
});
html+=`</div>`;
} else {
html+=`<div class="empty-state">暂无校准数据</div>`;
}

// Stocks timeline
html+=`<hr class="divider"><div class="section-title">📋 个股回溯</div>`;
if(stocks.length){
html+=`<div class="stock-grid">`;
stocks.forEach(r=>{
const isBull=(r.view||'')==='看多';
html+=`<div class="stock-card">
<div class="sym">${esc(r.symbol)} <span class="tag ${isBull?'tag-bull':'tag-bear'}">${esc(r.view)}</span></div>
<div class="meta">${esc(r.first_mention)} · 基准价 ${esc(r.base_price)}</div>
<div class="perf">
<span style="color:${signClass(r['1w'])};background:${signBg(r['1w'])}">1W ${esc(r['1w'])}</span>
<span style="color:${signClass(r['1m'])};background:${signBg(r['1m'])}">1M ${esc(r['1m'])}</span>
<span style="color:${signClass(r['6m'])};background:${signBg(r['6m'])}">6M ${esc(r['6m'])}</span>
</div>
<div class="since" style="color:${signClass(r.since)}">${esc(r.since)} 至今</div>
</div>`;
});
html+=`</div>`;
} else {
html+=`<div class="empty-state">暂无个股数据</div>`;
}

document.getElementById('app').innerHTML=html;
}).catch(()=>{
document.getElementById('app').innerHTML='<div style="padding:40px;text-align:center;color:var(--red)">⚠️ 加载失败，请刷新重试</div>';
});
</script>
</body>
</html>
