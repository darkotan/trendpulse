<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>{{ title }}</title>
  <meta name="description" content="{{ description }}">
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:type" content="article">
  <meta property="og:image" content="/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://trendscan.org/blog/{{ article.slug }}">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--black:#171717;--white:#fff;--gray-600:#4d4d4d;--gray-500:#666;--gray-400:#808080;--gray-100:#ebebeb;--gray-50:#fafafa;--blue:#0072f5;--accent:#7c3aed}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{overflow-x:hidden;max-width:100vw}
    body{background:var(--white);color:var(--black);font-family:'Geist',system-ui,sans-serif;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;line-height:1.6}
    .container{max-width:720px;margin:0 auto;padding:40px 24px}
    .back{color:var(--gray-400);text-decoration:none;font-size:13px;margin-bottom:24px;display:inline-block;transition:color .15s}
    .back:hover{color:var(--blue)}
    h1{font-size:28px;font-weight:700;line-height:1.3;margin-bottom:12px;letter-spacing:-0.56px}
    .meta{color:var(--gray-400);font-size:13px;margin-bottom:32px}
    .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
    .tag{font-size:10px;padding:2px 8px;background:rgba(124,58,237,.06);color:var(--accent);border-radius:4px;font-weight:500}
    .article-body{font-size:16px;line-height:1.8;color:#333}
    .article-body h2{font-size:22px;margin:32px 0 12px;font-weight:600;color:var(--black)}
    .article-body h3{font-size:18px;margin:24px 0 8px;font-weight:600;color:var(--black)}
    .article-body p{margin-bottom:16px}
    .article-body ul,.article-body ol{margin:8px 0 16px 24px}
    .article-body li{margin-bottom:6px}
    .article-body strong{color:var(--black)}
    .article-body a{color:var(--blue)}
    .article-body pre{background:var(--gray-50);padding:16px;border-radius:8px;overflow-x:auto;font-size:14px;margin:16px 0;border:1px solid var(--gray-100)}
    .article-body code{font-family:'Geist Mono',monospace;font-size:14px}
    .article-body em{color:var(--gray-600)}
    .article-body blockquote{border-left:3px solid var(--accent);padding-left:16px;margin:16px 0;color:var(--gray-600)}
    footer{text-align:center;padding:36px 20px;border-top:1px solid var(--gray-100);margin-top:36px;font-size:12px;color:var(--gray-400)}
    footer a{color:var(--gray-500);text-decoration:none}
    footer a:hover{color:var(--black)}
    @media(max-width:480px){
      .container{padding:24px 16px}
      h1{font-size:22px}
      .article-body{font-size:15px}
    }
  </style>
</head>
<body>
  {% include '_header.html' %}
  <div class="container">
    <a href="/blog" class="back">{{ T.blog_back }}</a>
    <h1>{{ article.title }}</h1>
    <div class="meta">
      {{ article.date }}
      {% if article.tags %}
      <div class="tags">{% for t in article.tags %}<span class="tag">{{ t }}</span>{% endfor %}</div>
      {% endif %}
    </div>
    <div class="article-body">
      {{ (article.body_html or article.content_html) | safe }}
    </div>
  </div>
  <footer>
    <a href="/">TrendPulse</a> · {{ T.blog_footer }}
  </footer>
</body>
</html>
