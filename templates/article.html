<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>{{ title }}</title>
  <meta name="description" content="{{ description }}">
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:type" content="article">
  <meta property="og:image" content="/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://trendscan.org/blog/{{ article.slug }}">
  <style>
    :root{--bg:#fff;--fg:#111;--muted:#888;--border:#e5e5e5;--accent:#0072f5}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
    .container{max-width:720px;margin:0 auto;padding:40px 20px}
    .back{color:var(--muted);text-decoration:none;font-size:14px;margin-bottom:24px;display:inline-block}
    .back:hover{color:var(--accent)}
    h1{font-size:32px;font-weight:700;line-height:1.3;margin-bottom:12px}
    .meta{color:var(--muted);font-size:14px;margin-bottom:32px}
    .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
    .tag{font-size:11px;padding:2px 8px;background:#f0f4ff;color:var(--accent);border-radius:4px}
    .article-body{font-size:17px;line-height:1.8;color:#222}
    .article-body h2{font-size:22px;margin:32px 0 12px;font-weight:600}
    .article-body h3{font-size:18px;margin:24px 0 8px;font-weight:600}
    .article-body p{margin-bottom:16px}
    .article-body ul{margin:8px 0 16px 24px}
    .article-body li{margin-bottom:6px}
    .article-body strong{color:#000}
    .article-body a{color:var(--accent)}
    .article-body pre{background:#f5f5f5;padding:16px;border-radius:8px;overflow-x:auto;font-size:14px;margin:16px 0}
    .article-body code{font-family:"SF Mono",Consolas,monospace;font-size:14px}
    .article-body em{color:#555}
    footer{text-align:center;padding:40px;color:var(--muted);font-size:13px;border-top:1px solid var(--border);margin-top:40px}
    footer a{color:var(--accent)}
  </style>
</head>
<body>
  <div class="container">
    <a href="/blog" class="back">← All Articles</a>
    <h1>{{ article.title }}</h1>
    <div class="meta">
      {{ article.date }}
      {% if article.tags %}
      <div class="tags">{% for t in article.tags %}<span class="tag">{{ t }}</span>{% endfor %}</div>
      {% endif %}
    </div>
    <div class="article-body">
      {{ article.body_html | safe }}
    </div>
  </div>
  <footer>
    <a href="/">TrendPulse</a> · Market intelligence for the AI era
  </footer>
</body>
</html>
