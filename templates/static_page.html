<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--black:#171717;--white:#fff;--gray-500:#666;--gray-400:#808080;--gray-100:#ebebeb;--blue:#0072f5}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{font-family:'Geist',system-ui,sans-serif;font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
    body{background:var(--white);color:var(--black);line-height:1.7;min-height:100vh}
    .container{max-width:640px;margin:0 auto;padding:40px 24px}
    header{position:sticky;top:0;z-index:100;background:var(--white);box-shadow:0 0 0 1px rgba(0,0,0,.08);padding:0 24px;height:56px;display:flex;align-items:center}
    header a{font-size:16px;font-weight:600;letter-spacing:-0.32px;color:var(--black);text-decoration:none;display:flex;align-items:center;gap:8px}
    .logo-dot{width:8px;height:8px;border-radius:50%;background:var(--blue)}
    h1{font-size:32px;font-weight:600;letter-spacing:-1.28px;margin-bottom:24px}
    p{margin-bottom:16px;color:var(--gray-500)}
    a{color:var(--blue);text-decoration:none}
    a:hover{text-decoration:underline}
    h2{font-size:20px;font-weight:600;margin:32px 0 12px}
    footer{text-align:center;padding:40px 24px;border-top:1px solid var(--gray-100);margin-top:60px}
    footer p{font-size:12px;color:var(--gray-400)}
  </style>
</head>
<body>
  <header><a href="/"><span class="logo-dot"></span>TrendPulse</a></header>
  <div class="container">
    {{ content|safe }}
  </div>
  <footer><p>TrendPulse · Real-time data aggregation</p></footer>
</body>
</html>
