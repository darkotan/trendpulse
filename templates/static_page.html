<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }}</title>
<!-- fonts loaded via _css.html -->
<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-family:'Geist',system-ui,sans-serif;font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
body { /* background from _css.html */ }
.container{max-width:640px;margin:0 auto;padding:40px 24px}
h1{font-size:32px;font-weight:600;letter-spacing:-1.28px;margin-bottom:24px}
p{margin-bottom:16px;color:var(--gray-500)}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
h2{font-size:20px;font-weight:600;margin:32px 0 12px}
footer{text-align:center;padding:40px 24px;border-top:1px solid var(--gray-100);margin-top:60px}
footer p{font-size:12px;color:var(--gray-400)}
</style>
</head>
<body>
{% include '_header.html' %}
<div class="container">
{{ content|safe }}
</div>
<footer><p>TrendPulse · Real-time data aggregation</p></footer>
</body>
</html>
